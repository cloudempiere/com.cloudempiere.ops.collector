source.. = src/
output.. = target/classes/
# ADR-001 §4.5: every OSGI-INF descriptor MUST be in the binary build, or the bundle
# installs ACTIVE while its DS components silently do not exist. The Jenkins guard
# (§4.16) greps the built JAR for OSGI-INF/*.xml to catch this.
bin.includes = META-INF/,\
               .,\
               OSGI-INF/
jre.compilation.profile = JavaSE-11
