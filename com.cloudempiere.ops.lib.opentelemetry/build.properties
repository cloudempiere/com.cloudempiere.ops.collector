# Pure embed-jar lib bundle (no source). The opentelemetry-api/context jars are copied
# into lib/ at build time by maven-dependency-plugin (see pom.xml), so lib/ MUST be in
# bin.includes or the embedded jars won't be in the built bundle.
bin.includes = META-INF/,\
               lib/
jre.compilation.profile = JavaSE-11
