source.. = src/
output.. = target/classes/
# metainfo/zk/config.xml MUST be at the jar root — ZK scans the classpath for it to
# register the <listener>s. As a fragment of org.adempiere.ui.zk, this jar's root is on
# the host's classpath, so ZK (running in the host) discovers it.
bin.includes = META-INF/,\
               .,\
               metainfo/
jre.compilation.profile = JavaSE-11
