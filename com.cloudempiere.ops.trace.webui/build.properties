source.. = src/
output.. = target/classes/
# OSGI-INF/ MUST be in the binary build — the host org.adempiere.ui.zk's wildcard
# `Service-Component: OSGI-INF/*.xml` globs this fragment's descriptor to activate the
# WebuiEnricherRegistrar. If it's missing, the registrar silently never runs (ADR-001 §4.5/§11.4).
bin.includes = META-INF/,\
               .,\
               OSGI-INF/
jre.compilation.profile = JavaSE-11
